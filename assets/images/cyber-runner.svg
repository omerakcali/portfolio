<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="720" fill="url(#bgGrad1)" rx="12" />
  <rect width="1272" height="712" x="4" y="4" fill="none" stroke="url(#cyanBorder)" stroke-width="2" stroke-opacity="0.3" rx="10" />

  <!-- Cyber Grid Background -->
  <g stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="540" x2="1280" y2="540" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
  </g>

  <!-- Center Gamepad Icon -->
  <g transform="translate(640, 310)" text-anchor="middle">
    <rect x="-80" y="-60" width="160" height="120" rx="20" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="3" stroke-dasharray="6,6" />
    <!-- Gamepad shape -->
    <path d="M-35,-15 C-45,-15 -50,-5 -50,15 C-50,30 -40,35 -30,35 C-25,35 -20,25 -10,25 L10,25 C20,25 25,35 30,35 C40,35 50,30 50,15 C50,-5 45,-15 35,-15 Z" fill="none" stroke="#00f0ff" stroke-width="4" />
    <circle cx="-28" cy="0" r="4" fill="#00f0ff" />
    <circle cx="-28" cy="10" r="4" fill="#00f0ff" />
    <circle cx="28" cy="5" r="4" fill="#00f0ff" />
    <circle cx="20" cy="-3" r="4" fill="#00f0ff" />
  </g>

  <!-- Banner overlay text -->
  <rect x="340" y="440" width="600" height="60" rx="10" fill="#070a12" fill-opacity="0.9" stroke="#00f0ff" stroke-width="2" />
  <text x="640" y="475" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="2">PROJECT 1: GAMEPLAY SCREENSHOT PLACEHOLDER</text>
  <text x="640" y="520" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Replace with your 16:9 game screenshot (e.g., assets/images/cyber-runner.jpg)</text>
</svg>
